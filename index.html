<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Looker Studio Portal</title>

  <!-- Icons für den Smartphone-Homebildschirm -->
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="icon" type="image/png" href="app-icon.png">

  <style>
    :root {
      /* Pfad zu deinem Hintergrundbild */
      --bg-image: url('bg.jpg');
      --tile-radius: 12px;
      --tile-size: 100px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: var(--bg-image) no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header-img {
      max-width: 300px;
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }

    .grid-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 35px;
      /* Maximal 2 Kacheln nebeneinander (100px + 35px + 100px) */
      max-width: 235px; 
      width: 100%;
    }

    .tile {
      width: var(--tile-size);
      height: var(--tile-size);
      background: rgba(30, 41, 59, 0.5);
      border: none;
      border-radius: var(--tile-radius);
      overflow: hidden;
      text-decoration: none;
      box-shadow: 
        0 0 2px #00d4ff,
        0 0 6px rgba(0, 212, 255, 0.8),
        0 0 12px rgba(0, 180, 255, 0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: block;
      flex-shrink: 0;
    }

    .tile:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 0 4px #00d4ff,
        0 0 10px rgba(0, 212, 255, 0.9),
        0 0 18px rgba(0, 180, 255, 0.7);
    }

    .tile-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <img src="header-logo.png" alt="Daily Buzzer Check Header" class="header-img">
  </header>

  <main class="grid-container" id="grid"></main>

  <script>
    const reports = [
      {
        image: "Report-Icon-MTD.png",
        url: "https://datastudio.google.com/embed/reporting/8f4a67a2-f159-46d4-ad35-ba0dc6ea4545/page/BLx5F"
      },
      {
        image: "Report-Icon-MTD-overview.png",
        url: "https://datastudio.google.com/embed/reporting/068c0329-b45c-4080-a858-4ac674edad96/page/3BN6F"
      },
      {
        image: "Report-Icon-DAILIES.png",
        url: "https://datastudio.google.com/embed/reporting/4e591a18-ba21-4a72-9c57-ab3abe55443a/page/p_cm5kcrgc6d"
      },
      {
        image: "Report-Icon-CASH.png",
        url: "https://datastudio.google.com/embed/reporting/4e591a18-ba21-4a72-9c57-ab3abe55443a/page/p_4sbesgy95d"
      },
      {
        image: "Report-Icon-D0-D28.png",
        url: "https://datastudio.google.com/embed/reporting/4e591a18-ba21-4a72-9c57-ab3abe55443a/page/Lgv5F"
      },
      {
        image: "Report-Icon-ACQUISITION.png",
        url: "https://datastudio.google.com/embed/reporting/28f5edd7-29f2-42ea-a112-91eb5d7e79cf/page/6wZ6F"
      }
    ];

    const grid = document.getElementById('grid');

    reports.forEach(report => {
      const tile = document.createElement('a');
      tile.className = 'tile';
      tile.href = report.url;
      tile.target = '_blank';

      tile.innerHTML = `
        <img src="${report.image}" alt="Dashboard Kachel" class="tile-img" loading="lazy">
      `;

      grid.appendChild(tile);
    });
  </script>
</body>
</html>
